<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Game Dungeon Home</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f0f13;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Horizontal Container holding both screens */
    #viewport {
      display: flex;
      width: 200vw;
      height: 100vh;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Screen 1: Android Apps Launcher */
    .screen {
      width: 100vw;
      height: 100vh;
      padding: 40px;
    }

    h1 { margin-bottom: 20px; font-size: 2rem; color: #ff0055; text-transform: uppercase; }

    #apps-grid {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding: 10px;
    }

    .app-card {
      background: #1e1e24;
      border: 3px solid transparent;
      border-radius: 12px;
      padding: 20px;
      min-width: 160px;
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    /* Controller D-Pad Focus Styling */
    .app-card:focus, .app-card.active {
      border-color: #00f0ff;
      background: #2b2b36;
      transform: scale(1.1);
      outline: none;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
    }

    /* Screen 2: Embedded Game Dungeon Frame */
    #crib-frame {
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

  <div id="viewport">
    <!-- LEFT SIDE: Android TV Apps -->
    <div class="screen" id="home-screen">
      <h1>Installed Apps</h1>
      <div id="apps-grid"></div>
    </div>

    <!-- RIGHT SIDE: The Game Dungeon -->
    <iframe id="crib-frame" src="https://thegamedungeon.github.io/"></iframe>
  </div>

  <script>
    let currentFocusIndex = 0;
    let appElements = [];
    let isCribActive = false;

    // Called automatically by Java once page finishes loading
    function initApps() {
      if (window.AndroidBridge) {
        const rawApps = window.AndroidBridge.getInstalledApps();
        const apps = JSON.parse(rawApps);
        const grid = document.getElementById('apps-grid');
        grid.innerHTML = '';

        apps.forEach((app, index) => {
          const card = document.createElement('div');
          card.className = 'app-card';
          card.tabIndex = 0; // Allows D-Pad focus
          card.innerText = app.name;
          card.dataset.package = app.packageName;

          card.onclick = () => window.AndroidBridge.launchApp(app.packageName);
          grid.appendChild(card);
        });

        appElements = document.querySelectorAll('.app-card');
        if (appElements.length > 0) updateFocus(0);
      }
    }

    function updateFocus(index) {
      if (appElements.length === 0 || isCribActive) return;
      appElements.forEach(el => el.classList.remove('active'));
      currentFocusIndex = index;
      appElements[currentFocusIndex].classList.add('active');
      appElements[currentFocusIndex].focus();
    }

    // Handle Controller D-Pad Navigation
    window.addEventListener('keydown', (e) => {
      if (isCribActive) {
        // If hit Back or Left on edge of Game Dungeon, go back home
        if (e.key === 'Backspace' || e.key === 'Escape') {
          goHome();
        }
        return;
      }

      if (e.key === 'ArrowRight') {
        if (currentFocusIndex < appElements.length - 1) {
          updateFocus(currentFocusIndex + 1);
        } else {
          // HIT THE FAR RIGHT EDGE -> SLIDE TO THE GAME DUNGEON!
          openGameDungeon();
        }
      } else if (e.key === 'ArrowLeft') {
        if (currentFocusIndex > 0) {
          updateFocus(currentFocusIndex - 1);
        }
      } else if (e.key === 'Enter' || e.key === ' ') {
        appElements[currentFocusIndex].click();
      }
    });

    function openGameDungeon() {
      isCribActive = true;
      document.getElementById('viewport').style.transform = 'translateX(-100vw)';
      document.getElementById('crib-frame').focus();
    }

    function goHome() {
      isCribActive = false;
      document.getElementById('viewport').style.transform = 'translateX(0)';
      if (appElements.length > 0) updateFocus(currentFocusIndex);
    }
  </script>
</body>
</html>
