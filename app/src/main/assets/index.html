<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Dungeon Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 40px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #ff4757;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 0 40px 40px 40px;
            gap: 30px;
            height: calc(100vh - 100px);
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .game-dungeon {
            flex: 2;
            display: flex;
            flex-direction: column;
        }

        .game-dungeon iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            background: #000;
        }

        .apps-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 16px;
            color: #ffa502;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 16px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            outline: none;
        }

        .app-card:focus, .app-card:hover {
            border-color: #ff4757;
            background: rgba(255, 71, 87, 0.2);
            transform: scale(1.08);
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.6);
        }

        .app-icon {
            width: 56px;
            height: 56px;
            object-fit: contain;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .app-name {
            font-size: 12px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* D-Pad Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Game Dungeon TV</h1>
        <div id="clock" style="font-size: 20px; font-weight: bold; color: #a4b0be;"></div>
    </header>

    <div class="main-container">
        <!-- Game Dungeon Main Portal -->
        <div class="section game-dungeon">
            <div class="section-title">Game Dungeon Portal</div>
            <iframe id="dungeonFrame" src="the-game-dungeon/index.html" tabindex="0"></iframe>
        </div>

        <!-- Installed Apps Panel -->
        <div class="section apps-panel">
            <div class="section-title">Your Apps</div>
            <div class="app-grid" id="appGrid">
                <!-- Dynamically populated by Java Bridge -->
            </div>
        </div>
    </div>

    <script>
        // Update Live Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Fetch installed apps from Java AndroidBridge
        function loadInstalledApps() {
            const appGrid = document.getElementById('appGrid');
            appGrid.innerHTML = '';

            if (typeof AndroidBridge !== 'undefined' && AndroidBridge.getInstalledApps) {
                try {
                    const apps = JSON.parse(AndroidBridge.getInstalledApps());

                    apps.forEach((app, index) => {
                        const card = document.createElement('div');
                        card.className = 'app-card';
                        card.tabIndex = 0; // Enables D-Pad navigation
                        
                        const iconImg = app.icon && app.icon.length > 0 
                            ? app.icon 
                            : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="%23ffa502"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>';

                        card.innerHTML = `
                            <img class="app-icon" src="${iconImg}" alt="${app.name}">
                            <div class="app-name">${app.name}</div>
                        `;

                        // Handle Remote Click / Enter key
                        card.addEventListener('click', () => {
                            AndroidBridge.launchApp(app.package);
                        });

                        card.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' || e.keyCode === 13) {
                                AndroidBridge.launchApp(app.package);
                            }
                        });

                        appGrid.appendChild(card);
                    });
                } catch (e) {
                    appGrid.innerHTML = '<div style="color:#ff4757; padding:10px;">Error parsing installed apps.</div>';
                }
            } else {
                // Browser Preview Fallback
                appGrid.innerHTML = `
                    <div class="app-card" tabindex="0">
                        <img class="app-icon" src="https://via.placeholder.com/56" alt="Test App">
                        <div class="app-name">Sample App</div>
                    </div>
                `;
            }
        }

        window.onload = loadInstalledApps;
    </script>
</body>
</html>
