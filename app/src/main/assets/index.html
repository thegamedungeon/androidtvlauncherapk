<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Dungeon Apps Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0d0e15;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-left: 2px solid rgba(255, 255, 255, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title {
            font-size: 18px;
            color: #ffa502;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .clock {
            font-size: 16px;
            font-weight: bold;
            color: #a4b0be;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
            gap: 16px;
            overflow-y: auto;
            flex: 1;
            padding-right: 6px;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            outline: none;
        }

        .app-card:focus, .app-card:hover {
            border-color: #ff4757;
            background: rgba(255, 71, 87, 0.25);
            transform: scale(1.08);
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.6);
        }

        .app-icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .app-name {
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            color: #f1f2f6;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <div class="section-title">TV Apps</div>
        <div id="clock" class="clock"></div>
    </header>

    <div class="app-grid" id="appGrid">
        <!-- Dynamically populated by Java AndroidBridge -->
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function loadInstalledApps() {
            const appGrid = document.getElementById('appGrid');
            appGrid.innerHTML = '';

            if (typeof AndroidBridge !== 'undefined' && AndroidBridge.getInstalledApps) {
                try {
                    const apps = JSON.parse(AndroidBridge.getInstalledApps());

                    apps.forEach((app) => {
                        const card = document.createElement('div');
                        card.className = 'app-card';
                        card.tabIndex = 0; // Enables TV Remote D-Pad focus

                        const iconImg = app.icon && app.icon.length > 0 
                            ? app.icon 
                            : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="%23ffa502"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>';

                        card.innerHTML = `
                            <img class="app-icon" src="${iconImg}" alt="${app.name}">
                            <div class="app-name">${app.name}</div>
                        `;

                        // Handle D-Pad Enter / Mouse click
                        card.addEventListener('click', () => {
                            AndroidBridge.launchApp(app.package);
                        });

                        card.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' || e.keyCode === 13) {
                                AndroidBridge.launchApp(app.package);
                            }
                        });

                        appGrid.appendChild(card);
                    });
                } catch (e) {
                    appGrid.innerHTML = '<div style="color:#ff4757; padding:10px;">Error reading installed apps.</div>';
                }
            } else {
                appGrid.innerHTML = `
                    <div class="app-card" tabindex="0">
                        <img class="app-icon" src="https://via.placeholder.com/48" alt="App">
                        <div class="app-name">Sample App</div>
                    </div>
                `;
            }
        }

        window.onload = loadInstalledApps;
    </script>
</body>
</html>
